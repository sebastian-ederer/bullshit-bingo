<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#1a1a2e" />
		<title>Offline - Attention Bingo</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				min-height: 100dvh;
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: system-ui, -apple-system, sans-serif;
				color: oklch(0.95 0.01 270);
				background-color: oklch(0.18 0.06 275);
				background-image:
					radial-gradient(ellipse 80% 60% at 10% 90%, oklch(0.4 0.18 200 / 0.5), transparent),
					radial-gradient(ellipse 60% 50% at 85% 20%, oklch(0.35 0.22 315 / 0.45), transparent),
					radial-gradient(ellipse 50% 40% at 50% 50%, oklch(0.3 0.12 285 / 0.35), transparent);
				background-attachment: fixed;
				-webkit-font-smoothing: antialiased;
			}

			.container {
				text-align: center;
				padding: 2rem;
				max-width: 420px;
			}

			.icon {
				width: 96px;
				height: 96px;
				margin: 0 auto 2rem;
				border-radius: 50%;
				background: oklch(0.3 0.06 278 / 0.4);
				backdrop-filter: blur(24px) saturate(1.8);
				-webkit-backdrop-filter: blur(24px) saturate(1.8);
				border: 1px solid oklch(1 0 0 / 0.12);
				box-shadow:
					inset 0 1px 0 0 oklch(1 0 0 / 0.1),
					0 8px 32px oklch(0 0 0 / 0.15);
				display: flex;
				align-items: center;
				justify-content: center;
				animation: pulse 3s ease-in-out infinite;
			}

			.icon svg {
				width: 44px;
				height: 44px;
				stroke: oklch(0.78 0.18 200);
				fill: none;
				stroke-width: 1.5;
				stroke-linecap: round;
				stroke-linejoin: round;
			}

			h1 {
				font-size: 1.75rem;
				font-weight: 700;
				margin-bottom: 0.75rem;
				background: linear-gradient(135deg, oklch(0.78 0.18 200), oklch(0.6 0.27 315));
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
			}

			p {
				color: oklch(0.7 0.03 275);
				font-size: 1rem;
				line-height: 1.6;
				margin-bottom: 2rem;
			}

			button {
				display: inline-flex;
				align-items: center;
				gap: 0.5rem;
				padding: 0.75rem 1.75rem;
				font-size: 0.95rem;
				font-weight: 600;
				color: oklch(0.05 0.03 275);
				background: oklch(0.78 0.18 200);
				border: none;
				border-radius: 0.75rem;
				cursor: pointer;
				backdrop-filter: blur(16px) saturate(1.8);
				-webkit-backdrop-filter: blur(16px) saturate(1.8);
				box-shadow: inset 0 1px 0 0 oklch(1 0 0 / 0.1);
				transition: transform 0.08s ease, filter 0.08s ease;
			}

			button:active {
				transform: scale(0.96);
				filter: brightness(0.85);
			}

			button svg {
				width: 18px;
				height: 18px;
				stroke: currentColor;
				fill: none;
				stroke-width: 2;
				stroke-linecap: round;
				stroke-linejoin: round;
			}

			.dots {
				display: flex;
				justify-content: center;
				gap: 0.5rem;
				margin-top: 2.5rem;
			}

			.dot {
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: oklch(0.78 0.18 200 / 0.5);
				animation: blink 1.5s ease-in-out infinite;
			}

			.dot:nth-child(2) { animation-delay: 0.3s; }
			.dot:nth-child(3) { animation-delay: 0.6s; }

			@keyframes pulse {
				0%, 100% { transform: scale(1); opacity: 1; }
				50% { transform: scale(1.05); opacity: 0.85; }
			}

			@keyframes blink {
				0%, 100% { opacity: 0.3; }
				50% { opacity: 1; }
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="icon">
				<svg viewBox="0 0 24 24">
					<path d="M1 1l22 22" />
					<path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
					<path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
					<path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
					<path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
					<path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
					<line x1="12" y1="20" x2="12.01" y2="20" />
				</svg>
			</div>
			<h1>You're Offline</h1>
			<p>Looks like you've lost your connection. Check your network and try again — the bingo board will be waiting.</p>
			<button onclick="window.location.reload()">
				<svg viewBox="0 0 24 24">
					<polyline points="23 4 23 10 17 10" />
					<path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
				</svg>
				Retry
			</button>
			<div class="dots">
				<div class="dot"></div>
				<div class="dot"></div>
				<div class="dot"></div>
			</div>
		</div>
		<script>
			window.addEventListener('online', () => window.location.reload());
		</script>
	</body>
</html>
